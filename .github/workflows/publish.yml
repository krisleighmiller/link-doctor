name: Publish Python package

# Setup and rehearsal never publish. Upload requires a manual dispatch with
# dry_run=false AND approval of the selected GitHub environment.
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Package index
        required: true
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      dry_run:
        description: Validate and build only (no upload)
        required: true
        type: boolean
        default: true
      version:
        description: Exact package version expected from this commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Validate version and run regression suite
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src
        run: |
          python -c 'import os; from link_doctor import __version__; assert os.environ["EXPECTED_VERSION"] == __version__, "Version input does not match this commit"'
          python --version
          gcc --version
          ld.bfd --version
          python -m unittest discover -s tests -v
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
          python scripts/inspect-distributions.py dist
      - name: Verify clean installation and examples
        run: |
          python -m venv "$RUNNER_TEMP/clean-venv"
          scripts/verify-package.sh dist/link_doctor-*.whl "$RUNNER_TEMP/clean-venv/bin/python" "$RUNNER_TEMP/package-check" dist/link_doctor-*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && !inputs.dry_run }}
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.repository }}
      url: ${{ inputs.repository == 'pypi' && 'https://pypi.org/project/link-doctor/' || 'https://test.pypi.org/project/link-doctor/' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish using short-lived trusted credentials
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ inputs.repository == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          attestations: true
